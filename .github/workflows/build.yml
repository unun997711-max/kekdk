          package com.ilarion.game;

          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RadialGradient;
          import android.graphics.Shader;
          import java.util.HashMap;

          public final class Glow {
              private Glow() {}

              private static final HashMap<Long, Bitmap> CACHE = new HashMap<Long, Bitmap>();

              public static synchronized Bitmap get(int radius, int color) {
                  if (radius < 1) radius = 1;
                  if (radius > 64) radius = 64;
                  long key = (((long) radius) << 32) | (color & 0xFFFFFFFFL);
                  Bitmap b = CACHE.get(key);
                  if (b != null) return b;
                  int d = radius * 2;
                  b = Bitmap.createBitmap(d, d, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(b);
                  Paint p = new Paint();
                  p.setAntiAlias(true);
                  int c0 = Pal.alpha(color, 210);
                  int c1 = Pal.alpha(color, 70);
                  int c2 = Pal.alpha(color, 0);
                  p.setShader(new RadialGradient(radius, radius, radius,
                          new int[]{c0, c1, c2}, new float[]{0f, 0.45f, 1f}, Shader.TileMode.CLAMP));
                  c.drawCircle(radius, radius, radius, p);
                  CACHE.put(key, b);
                  return b;
              }
          }

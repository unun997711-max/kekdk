          package com.ilarion.game;

          import android.graphics.Bitmap;

          public final class Frames {
              public final Bitmap[] r;
              public final Bitmap[] l;
              public final int w;
              public final int h;

              public Frames(Bitmap[] right) {
                  r = right;
                  l = new Bitmap[right.length];
                  for (int i = 0; i < right.length; i++) {
                      l[i] = Px.flip(right[i]);
                  }
                  w = right[0].getWidth();
                  h = right[0].getHeight();
              }

              public Bitmap get(int i, int facing) {
                  if (i < 0 || i >= r.length) i = 0;
                  return facing >= 0 ? r[i] : l[i];
              }
          }

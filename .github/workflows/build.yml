          package com.ilarion.game;

          import android.graphics.Bitmap;
          import android.graphics.Canvas;

          public final class HeroArt {
              private HeroArt() {}

              private static final int OX = 10;
              private static final int OY = 3;
              private static final int CW = 44;
              private static final int CH = 33;

              public static Frames build(HeroLook k) {
                  Bitmap[] f = new Bitmap[Anim.HERO_COUNT];
                  for (int i = 0; i < f.length; i++) {
                      Bitmap b = Px.make(CW, CH);
                      Canvas c = new Canvas(b);
                      draw(c, k, i);
                      f[i] = Px.outline(b, Pal.OUTLINE);
                  }
                  return new Frames(f);
              }

              private static void r(Canvas c, int x, int y, int w, int h, int col) {
                  Px.rect(c, x + OX, y + OY, w, h, col);
              }

              private static void leg(Canvas c, int x, int bob, int lift, int pants, int boots) {
                  int top = 21 + bob;
                  int bootTop = 28 - lift;
                  if (bootTop <= top) bootTop = top + 1;
                  r(c, x, top, 3, bootTop - top, pants);
                  r(c, x, bootTop, 4, 2, boots);
              }

              private static void weapon(Canvas c, HeroLook k, int hx, int hy, boolean up) {
                  int col = k.weapon;
                  int lt = Pal.light(col);
                  int dk = Pal.dark(col);
                  switch (k.wtype) {
                      case 1:
                          r(c, hx, hy - 3, 4, 5, col);
                          r(c, hx + 1, hy - 2, 2, 3, 0xFFFFF2B0);
                          r(c, hx + 1, hy - 4, 2, 1, dk);
                          break;
                      case 2:
                          if (up) {
                              r(c, hx, hy - 9, 1, 9, lt);
                          } else {
                              r(c, hx, hy, 9, 1, lt);
                          }
                          break;
                      case 4:
                          if (up) {
                              r(c, hx, hy - 12, 2, 13, Pal.BROWN);
                              r(c, hx - 1, hy - 14, 4, 4, col);
                          } else {
                              r(c, hx, hy, 10, 2, Pal.BROWN);
                              r(c, hx + 8, hy - 1, 4, 4, col);
                          }
                          break;
                      default:
                          int len = (k.wtype == 5) ? 12 : (k.wtype == 3 ? 6 : 10);
                          int th = (k.wtype == 5) ? 3 : 2;
                          if (up) {
                              r(c, hx, hy - len, th, len, col);
                              r(c, hx, hy - len, 1, len, lt);
                              r(c, hx - 1, hy, th + 2, 1, dk);
                          } else {
                              r(c, hx, hy, len, th, col);
                              r(c, hx, hy, len, 1, lt);
                              r(c, hx - 1, hy - 1, 1, th + 2, dk);
                          }
                          break;
                  }
              }

              private static void draw(Canvas c, HeroLook k, int f) {
                  int bob = 0;
                  if (f == Anim.IDLE1 || f == Anim.HURT) bob = 1;
                  if (f >= Anim.RUN0 && f <= Anim.RUN3 && ((f - Anim.RUN0) & 1) == 1) bob = 1;
                  int wide = k.big ? 1 : 0;
                  int ax = 0, bx = 0, al = 0, bl = 0;
                  switch (f) {
                      case Anim.RUN0: ax = 2; bx = -2; break;
                      case Anim.RUN1: bl = 2; break;
                      case Anim.RUN2: ax = -2; bx = 2; break;
                      case Anim.RUN3: al = 2; break;
                      case Anim.JUMP: ax = 2; bx = -1; al = 2; bl = 3; break;
                      case Anim.FALL: ax = 1; bx = -1; break;
                      case Anim.HURT: ax = -1; bx = 1; break;
                      default: break;
                  }
                  boolean atk = (f == Anim.ATK0 || f == Anim.ATK1);

                  if (k.cape != 0) {
                      int s = 0;
                      if (f >= Anim.RUN0 && f <= Anim.RUN3) s = -1 - ((f - Anim.RUN0) & 1);
                      else if (f == Anim.JUMP) s = -2;
                      else if (f == Anim.FALL) s = -1;
                      else if (f == Anim.ATK1) s = -2;
                      r(c, 6 + s - wide, 13 + bob, 5, 11, k.cape);
                      r(c, 4 + s - wide, 19 + bob, 4, 6, Pal.dark(k.cape));
                  }
                  if (k.longHair && !k.hood) {
                      r(c, 5, 6 + bob, 4, 10, k.hair);
                  }

                  r(c, 8 - wide, 14 + bob, 2, 6, Pal.dark(k.cloth2));
                  r(c, 8 - wide, 20 + bob, 2, 2, Pal.dark(k.skin));

                  leg(c, 9 + bx, bob, bl, Pal.dark(k.pants), k.boots);
                  leg(c, 12 + ax, bob, al, k.pants, k.boots);

                  int tx = 9 - wide;
                  int tw = 6 + 2 * wide;
                  r(c, tx, 13 + bob, tw, 8, k.cloth);
                  r(c, tx, 13 + bob, 1, 8, Pal.dark(k.cloth));
                  r(c, tx, 13 + bob, tw, 1, k.trim);
                  r(c, tx, 19 + bob, tw, 1, k.trim);
                  r(c, 11, 15 + bob, 2, 2, Pal.light(k.cloth));

                  r(c, 11, 12 + bob, 3, 1, Pal.dark(k.skin));
                  r(c, 8, 5 + bob, 8, 7, k.skin);
                  r(c, 8, 5 + bob, 1, 7, Pal.dark(k.skin));
                  if (f == Anim.HURT) {
                      r(c, 11, 9 + bob, 2, 1, k.eye);
                      r(c, 14, 9 + bob, 2, 1, k.eye);
                  } else {
                      r(c, 11, 8 + bob, 1, 2, k.eye);
                      r(c, 14, 8 + bob, 1, 2, k.eye);
                  }
                  if (k.glasses) {
                      r(c, 10, 7 + bob, 3, 3, k.glassCol);
                      r(c, 11, 8 + bob, 1, 1, 0xFFFFE6E6);
                      r(c, 13, 7 + bob, 3, 3, k.glassCol);
                      r(c, 14, 8 + bob, 1, 1, 0xFFFFE6E6);
                      r(c, 12, 8 + bob, 1, 1, k.glassCol);
                  }
                  if (k.hasBeard) {
                      r(c, 8, 9 + bob, 8, 3, k.beard);
                      r(c, 9, 12 + bob, 5, 2, k.beard);
                  }
                  if (k.mask) {
                      r(c, 8, 9 + bob, 8, 3, k.maskCol);
                  }
                  if (k.hood) {
                      r(c, 7, 3 + bob, 10, 3, k.hoodCol);
                      r(c, 6, 5 + bob, 3, 8, k.hoodCol);
                      r(c, 15, 5 + bob, 1, 2, k.hoodCol);
                      r(c, 4, 7 + bob, 3, 3, Pal.dark(k.hoodCol));
                  } else {
                      r(c, 7, 3 + bob, 10, 3, k.hair);
                      r(c, 7, 5 + bob, 2, 5, k.hair);
                      r(c, 12, 5 + bob, 4, 1, k.hair);
                      r(c, 9, 3 + bob, 4, 1, Pal.light(k.hair));
                  }
                  if (k.headband) {
                      r(c, 8, 5 + bob, 8, 1, k.band);
                      r(c, 4, 6 + bob, 4, 1, k.band);
                      r(c, 3, 7 + bob, 3, 1, k.band);
                  }

                  int fx = 14 + wide;
                  if (f == Anim.ATK0) {
                      r(c, fx, 14, 3, 2, k.cloth2);
                      r(c, fx + 2, 11, 2, 5, k.cloth2);
                      r(c, fx + 2, 10, 2, 2, k.skin);
                      weapon(c, k, fx + 2, 10, true);
                  } else if (f == Anim.ATK1) {
                      r(c, fx, 15, 6, 2, k.cloth2);
                      r(c, fx + 5, 15, 2, 2, k.skin);
                      weapon(c, k, fx + 6, 15, false);
                  } else {
                      int ay = 14 + bob;
                      if (f == Anim.JUMP) ay = 11;
                      if (f == Anim.HURT) ay = 12;
                      r(c, fx, ay, 2, 6, k.cloth2);
                      r(c, fx, ay + 6, 2, 2, k.skin);
                      if (!atk) {
                          r(c, fx + 1, 19 + bob, 2, 3, k.weapon);
                      }
                  }
              }
          }

          package com.ilarion.game;

          import android.graphics.Canvas;

          public final class PixelFont {
              private PixelFont() {}

              private static String glyph(char ch) {
                  switch (ch) {
                      case '0': return "111101101101111";
                      case '1': return "010110010010111";
                      case '2': return "111001111100111";
                      case '3': return "111001111001111";
                      case '4': return "101101111001001";
                      case '5': return "111100111001111";
                      case '6': return "111100111101111";
                      case '7': return "111001001001001";
                      case '8': return "111101111101111";
                      case '9': return "111101111001111";
                      case '/': return "001001010100100";
                      case ':': return "000010000010000";
                      case '-': return "000000111000000";
                      case '+': return "000010111010000";
                      case 'P': return "111101111100100";
                      case 'x': return "000101010101000";
                      default: return null;
                  }
              }

              public static int width(String s, int scale) {
                  if (s.length() == 0) return 0;
                  return s.length() * 4 * scale - scale;
              }

              public static void draw(Canvas c, String s, int x, int y, int color, int scale) {
                  for (int i = 0; i < s.length(); i++) {
                      String g = glyph(s.charAt(i));
                      if (g == null) continue;
                      for (int k = 0; k < 15; k++) {
                          if (g.charAt(k) == '1') {
                              int gx = k % 3;
                              int gy = k / 3;
                              Px.rect(c, x + i * 4 * scale + gx * scale, y + gy * scale, scale, scale, color);
                          }
                      }
                  }
              }

              public static void drawShadow(Canvas c, String s, int x, int y, int color, int scale) {
                  draw(c, s, x + 1, y + 1, 0xFF000000, scale);
                  draw(c, s, x, y, color, scale);
              }

              public static void drawOutlined(Canvas c, String s, int x, int y, int color, int scale) {
                  draw(c, s, x - 1, y, 0xFF000000, scale);
                  draw(c, s, x + 1, y, 0xFF000000, scale);
                  draw(c, s, x, y - 1, 0xFF000000, scale);
                  draw(c, s, x, y + 1, 0xFF000000, scale);
                  draw(c, s, x, y, color, scale);
              }

              public static String fmt(int v) {
                  String s = Integer.toString(Math.abs(v));
                  StringBuilder sb = new StringBuilder();
                  int n = s.length();
                  for (int i = 0; i < n; i++) {
                      if (i > 0 && (n - i) % 3 == 0) sb.append(' ');
                      sb.append(s.charAt(i));
                  }
                  return (v < 0 ? "-" : "") + sb.toString();
              }

              public static String pad(int v, int digits) {
                  String s = Integer.toString(Math.max(0, v));
                  while (s.length() < digits) s = "0" + s;
                  return s;
              }
          }
